{% extends "layout/base.html" %}

{% block content %}
<section class="section">
    <div class="container">
        <nav class="breadcrumb" aria-label="breadcrumbs">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/notes">Notes</a></li>
                <li><a href="/notes/{{ dir.id }}">{{ dir.label }}</a></li>
                <li class="is-active"><a aria-current="page">{{ note.name }}</a></li>
            </ul>
        </nav>

        <div class="is-flex is-justify-content-space-between is-align-items-center mb-5">
            <h1 class="title mb-0">{{ note.name }}</h1>
            <div class="buttons">
                <a class="button" href="/notes/{{ dir.id }}">Back</a>
                {% if can_edit %}<a class="button is-primary" href="/notes/{{ dir.id }}/entries/{{ note.id }}/edit">Edit</a>{% endif %}
                <button class="button is-danger is-light" type="button" disabled title="Delete is not available yet">Delete</button>
            </div>
        </div>

        <div class="box is-shadowless has-background-light">
            <pre class="is-family-monospace is-size-6 is-whitespace-pre-wrap"><code>{{ content }}</code></pre>
        </div>
    </div>
</section>
{% endblock %}
